[project]
name = "msc-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chronos-forecasting>=2.3.2",
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
]

# The default Linux torch wheel targets a newer CUDA than the server driver (12.4) supports, so
# torch silently falls back to CPU. cu126 wheels run on 12.x drivers; macOS keeps the PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
