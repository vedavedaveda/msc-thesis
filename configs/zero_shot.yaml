# Config for the zero-shot dataset (see data/builders/zero_shot.py).
# Mirrors the mobility-baselines Chronos-2 Citi Bike setup (conf/dataset/NYC_Citi_Bike_pick-drop.yaml):
# forecast one channel, pass the other as past covariate.
# Bin size and the check-in/out definition come from configs/stop_timeseries.yaml (paper: 30 min).
year: 2017                    # reads data/processed/stop_timeseries/<year>/
start_date: 2017-04-01        # first day of the window (paper: 2016-04-01)
n_days: 91                    # window length in days (paper: 91, Apr-Jun)
start_test_day: 77            # test = days [77, 91), i.e. the last 14 (paper: 63/14/14 train/val/test)
n_test_days: 14
n_stations: 250               # busiest stops by pre-test volume (paper: 250 Citi Bike stations)
stations: null                # explicit list of stop IDs; overrides n_stations
target: check_ins             # paper: bike_pick
past_covariates: [check_outs] # paper: bike_drop
